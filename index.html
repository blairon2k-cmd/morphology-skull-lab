<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MORPHOLOGY Skull Lab</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #181818;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    #app {
      display: flex;
      height: calc(100vh - 65px);
    }

    #controls {
      width: 280px;
      padding: 20px;
      background: #151515;
      border-right: 1px solid #333;
      box-sizing: border-box;
    }

    #viewer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #777;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #252525;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  MORPHOLOGY — SKULL LAB
</header>

<div id="app">

  <div id="controls">

    <h3>SKULL</h3>

    <button>Duplicate Skull</button>
    <button>Reset Simulation</button>

    <h3>SIMULATION</h3>

    <button>Sutural Osteogenesis</button>
    <button>Periosteal Apposition</button>
    <button>Periosteal Resorption</button>
    <button>Endochondral Ossification</button>

    <h3>OTHER</h3>

    <button>Landmarks</button>
    <button>Attractiveness Formula</button>
    <button>Osteotomies</button>

  </div>

  <div id="viewer">
    3D SKULL WILL GO HERE
  </div>

</div>

</body>
</html>
