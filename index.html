<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MORPHOLOGY Skull Lab</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #181818;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    #app {
      display: flex;
      height: calc(100vh - 65px);
    }

    #controls {
      width: 280px;
      padding: 20px;
      background: #151515;
      border-right: 1px solid #333;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #viewer {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #080808;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 18px;
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #252525;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  MORPHOLOGY — SKULL LAB
</header>

<div id="app">

  <div id="controls">

    <h3>SKULL</h3>

    <button>Duplicate Skull</button>
    <button>Reset Simulation</button>

    <h3>SIMULATION</h3>

    <button>Sutural Osteogenesis</button>
    <button>Periosteal Apposition</button>
    <button>Periosteal Resorption</button>
    <button>Endochondral Ossification</button>

    <h3>OTHER</h3>

    <button>Landmarks</button>
    <button>Attractiveness Formula</button>
    <button>Osteotomies</button>

  </div>

  <div id="viewer">
    <div id="loading">LOADING 3D SKULL...</div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
  
  <script type="module">

  import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

  import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

  import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


  // -----------------------------
  // VIEWER
  // -----------------------------

  const viewer = document.getElementById("viewer");
  const loading = document.getElementById("loading");

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0x080808);


  // -----------------------------
  // CAMERA
  // -----------------------------

  const camera = new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth / viewer.clientHeight,
    0.01,
    1000
  );

  camera.position.set(0, 0, 3);


  // -----------------------------
  // RENDERER
  // -----------------------------

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
  );

  viewer.appendChild(renderer.domElement);


  // -----------------------------
  // LIGHTING
  // -----------------------------

  const ambientLight =
    new THREE.HemisphereLight(
      0xffffff,
      0x444444,
      3
    );

  scene.add(ambientLight);


  const keyLight =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  keyLight.position.set(5, 5, 5);

  scene.add(keyLight);


  const fillLight =
    new THREE.DirectionalLight(
      0xffffff,
      1.5
    );

  fillLight.position.set(-5, 2, 3);

  scene.add(fillLight);


  // -----------------------------
  // CAMERA CONTROLS
  // -----------------------------

  const controls =
    new OrbitControls(
      camera,
      renderer.domElement
    );

  controls.enableDamping = true;

  controls.dampingFactor = 0.05;

  controls.minDistance = 0.2;

  controls.maxDistance = 20;


  // -----------------------------
  // LOAD LOCAL SKULL
  // -----------------------------

  const loader = new GLTFLoader();

  loader.load(

    "./ScatteringSkull.glb",

    function (gltf) {

      const skull = gltf.scene;

      scene.add(skull);


      // Find the size of the skull

      const box =
        new THREE.Box3().setFromObject(skull);

      const center =
        box.getCenter(new THREE.Vector3());

      const size =
        box.getSize(new THREE.Vector3());


      // Center the skull

      skull.position.x -= center.x;
      skull.position.y -= center.y;
      skull.position.z -= center.z;


      // Automatically scale it

      const maxDimension =
        Math.max(
          size.x,
          size.y,
          size.z
        );

      const scale =
        2 / maxDimension;

      skull.scale.setScalar(scale);


      // Recalculate after scaling

      controls.target.set(0, 0, 0);

      camera.position.set(0, 0, 3);

      camera.lookAt(0, 0, 0);


      loading.style.display = "none";

    },

    function (xhr) {

      if (xhr.total > 0) {

        const percent =
          (xhr.loaded / xhr.total) * 100;

        loading.textContent =
          "LOADING 3D SKULL... " +
          Math.round(percent) +
          "%";
      }

    },

    function (error) {

      console.error(
        "SKULL LOAD ERROR:",
        error
      );

      loading.textContent =
        "ERROR LOADING SKULL";

    }

  );


  // -----------------------------
  // RESIZE
  // -----------------------------

  window.addEventListener(
    "resize",
    function () {

      camera.aspect =
        viewer.clientWidth /
        viewer.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
      );

    }
  );


  // -----------------------------
  // ANIMATION
  // -----------------------------

  function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

</script>

</body>
</html>
